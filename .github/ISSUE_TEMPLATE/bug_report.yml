name: Bug report
description: Something broke, or didn't work the way it should have.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for testing SPOOL! The more detail you can give here, the
        faster this can get fixed — see the README's "Found a bug, or
        something confusing?" section for what's most helpful to include.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe what went wrong, as specifically as you can.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The exact steps you took, as best you can recall — even a rough list helps a lot.
      placeholder: |
        1. Opened the library page
        2. Searched for "boat"
        3. Clicked on...
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: What OS are you on?
      options:
        - macOS
        - Windows
        - Not sure
    validations:
      required: true
  - type: input
    id: os-version
    attributes:
      label: OS version (if you know it)
      placeholder: e.g. macOS Sequoia 15.4, or Windows 11
    validations:
      required: false
  - type: textarea
    id: errors
    attributes:
      label: Error messages / screenshots
      description: >
        Paste any error text you saw. For screenshots, drag an image
        straight into this box on GitHub and it'll attach itself.
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Setup/Docker logs (if this happened during setup, or SPOOL won't start)
      description: >
        Paste the output of `docker compose ps` and `docker compose logs api`
        (or `docker compose logs worker`) here if relevant.
      render: shell
    validations:
      required: false
