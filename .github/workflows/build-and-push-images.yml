# Builds and pushes SPOOL's three service images (api, watcher, worker) to
# GHCR for both linux/amd64 and linux/arm64, tagged :latest and :<version>.
#
# This is what lets a fresh install (setup.sh/setup.ps1, plain `docker
# compose up -d`, no --build) pull a ready-made image instead of building
# from source on the tester's own machine — a from-scratch build means
# compiling/downloading cadquery-ocp's full OpenCASCADE bundle plus
# trimesh/pyrender's EGL/Mesa stack, which is most of what made a first
# install slow. The local dev workflow (`docker compose up -d --build`,
# see CONTRIBUTING.md) is unaffected either way, since --build always
# builds locally regardless of what's tagged in `image:`.
#
# Manual trigger only, run by hand as part of cutting a release (see
# CONTRIBUTING.md's "Publishing pre-built images" section) — not run on
# every push, since most commits don't warrant re-publishing multi-arch
# images (a slow, non-trivial CI cost, especially for the worker image's
# ~1.4GB of geometry-library dependencies under arm64 QEMU emulation).
name: Build and Push Images

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to publish alongside :latest (e.g. v1.7.0)"
        required: true

env:
  REGISTRY: ghcr.io
  OWNER: joannewood

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push api
        uses: docker/build-push-action@v6
        with:
          context: ./services
          file: ./services/api/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/spool-api:latest
            ${{ env.REGISTRY }}/${{ env.OWNER }}/spool-api:${{ inputs.version }}

      - name: Build and push watcher
        uses: docker/build-push-action@v6
        with:
          context: ./services
          file: ./services/watcher/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/spool-watcher:latest
            ${{ env.REGISTRY }}/${{ env.OWNER }}/spool-watcher:${{ inputs.version }}

      # Shared by both worker (JOB_TYPES=ingest,render,extract_zip) and
      # worker-step (JOB_TYPES=render_step) in docker-compose.yml — one
      # image, one push, same as the local `image: spool-worker` tag both
      # services already shared before this workflow existed.
      - name: Build and push worker
        uses: docker/build-push-action@v6
        with:
          context: ./services
          file: ./services/worker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/spool-worker:latest
            ${{ env.REGISTRY }}/${{ env.OWNER }}/spool-worker:${{ inputs.version }}
