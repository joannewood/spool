# Builds SPOOL-Installer.exe (see scripts/windows-installer.iss) on a
# GitHub-hosted windows-latest runner. This exists specifically because
# this project's normal dev loop has no Windows machine to build or test
# this on at all — running it here is the only way to know the packaging
# actually compiles, short of a real person doing it on real Windows
# hardware. It doesn't prove the installer's interactive flow (the wizard,
# setup.ps1's dialogs) works correctly — only that it builds. Manual
# trigger only, matching scripts/build-mac-installer.sh's "run by hand
# before cutting a release" convention — not run on every push.
name: Build Windows Installer

on:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Syntax-check PowerShell scripts
        shell: pwsh
        run: |
          $scripts = @("setup.ps1", "host-helper\configure_apps_windows.ps1", "host-helper\install_windows.ps1", "host-helper\uninstall_windows.ps1")
          $failed = $false
          foreach ($script in $scripts) {
            $parseErrors = $null
            $tokens = $null
            [System.Management.Automation.Language.Parser]::ParseFile($script, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -gt 0) {
              $parseErrors | ForEach-Object { Write-Host "::error::${script}: $_" }
              $failed = $true
            } else {
              Write-Host "${script}: parses cleanly ($($tokens.Count) tokens)"
            }
          }
          if ($failed) { throw "one or more PowerShell scripts failed to parse" }

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          iscc.exe scripts\windows-installer.iss

      - name: Verify installer was produced
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path dist -Filter "SPOOL-Installer.exe" -ErrorAction SilentlyContinue
          if (-not $exe) { throw "SPOOL-Installer.exe not found in dist/ after build" }
          Write-Host "Built: $($exe.FullName) ($('{0:N1}' -f ($exe.Length / 1MB)) MB)"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: SPOOL-Installer
          path: dist/SPOOL-Installer.exe
          retention-days: 14
