# Builds SPOOL-Installer.exe (see scripts/windows-installer.iss) on a
# GitHub-hosted windows-latest runner. This exists specifically because
# this project's normal dev loop has no Windows machine to build or test
# this on at all — running it here is the only way to know the packaging
# actually compiles, short of a real person doing it on real Windows
# hardware. It doesn't prove the installer's interactive flow (the wizard,
# setup.ps1's dialogs) works correctly — only that it builds. Manual
# trigger only, matching scripts/build-mac-installer.sh's "run by hand
# before cutting a release" convention — not run on every push.
name: Build Windows Installer

on:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Syntax-check PowerShell scripts
        shell: pwsh
        run: |
          $scripts = @("setup.ps1", "host-helper\configure_apps_windows.ps1", "host-helper\install_windows.ps1", "host-helper\uninstall_windows.ps1")
          $failed = $false
          foreach ($script in $scripts) {
            $parseErrors = $null
            $tokens = $null
            [System.Management.Automation.Language.Parser]::ParseFile($script, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -gt 0) {
              $parseErrors | ForEach-Object { Write-Host "::error::${script}: $_" }
              $failed = $true
            } else {
              Write-Host "${script}: parses cleanly ($($tokens.Count) tokens)"
            }
          }
          if ($failed) { throw "one or more PowerShell scripts failed to parse" }

      - name: Verify -STA actually produces an STA thread
        shell: pwsh
        # Exercises the same `powershell.exe -STA ...` invocation
        # windows-installer.iss now uses for setup.ps1 (see its [Run]
        # section's own comment), on a real Windows runner -- not just a
        # syntax parse. `& powershell.exe ...` spawns a genuinely separate
        # process (not just checking this step's own pwsh host), which is
        # what actually matters here: added after a real tester's install
        # crashed silently at the very first WinForms dialog, with no
        # visible error at all.
        run: |
          $output = & powershell.exe -NoProfile -ExecutionPolicy Bypass -STA -Command "Add-Type -AssemblyName System.Windows.Forms; [System.Threading.Thread]::CurrentThread.GetApartmentState()"
          Write-Host "Apartment state: $output"
          if ($output -ne "STA") { throw "expected STA, got '$output'" }

      - name: Verify native-stderr try/catch fix actually works
        shell: pwsh
        # A real tester's install crashed silently at `docker volume
        # inspect spool_pgdata 2>$null 1>$null` on a fresh machine (no
        # such volume yet) -- confirmed root cause: under
        # $ErrorActionPreference = "Stop", Windows PowerShell promotes
        # each line a native command writes to stderr into a terminating
        # error BEFORE the redirection destination is honored, so
        # "2>$null" alone never actually suppresses it. Both call sites
        # in setup.ps1 now wrap this in try/catch instead -- this proves
        # the underlying assumption on a real Windows runner rather than
        # just reasoning about it: (1) the unwrapped pattern really does
        # throw, and (2) try/catch really does suppress it while
        # $LASTEXITCODE still correctly reflects the native process's
        # real exit code afterward.
        run: |
          $ErrorActionPreference = "Stop"
          $threw = $false
          try {
              cmd /c "echo fakeerror 1>&2 & exit 3" 2>$null 1>$null
          } catch {
              $threw = $true
          }
          Write-Host "Unwrapped call threw: $threw; LASTEXITCODE: $LASTEXITCODE"
          if (-not $threw) { throw "expected the unwrapped native-stderr redirection to throw under ErrorActionPreference=Stop -- if it doesn't, the bug this fix targets may not be real" }
          if ($LASTEXITCODE -ne 3) { throw "expected LASTEXITCODE to still be 3 after the caught exception, got $LASTEXITCODE" }
          Write-Host "Confirmed: try/catch suppresses the spurious exception while LASTEXITCODE survives correctly."

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build the SPOOL desktop app
        shell: pwsh
        # windows-latest ships WebView2 and the MSVC build tools Tauri
        # needs already -- no extra setup beyond Rust/Node. Skips Tauri's
        # own bundler (no --bundles flag) since a Tauri Windows build is
        # already a single self-contained .exe (WebView2 is a system
        # component on modern Windows, not something to embed) -- wrapping
        # it in ANOTHER installer would be pointless when Inno Setup is
        # already the one true installer here. Unsigned, matching this
        # project's existing documented tradeoff for the main Windows
        # installer itself (see this file's own header comment) --
        # SmartScreen's reputation check is keyed off a file's own
        # "downloaded from the internet" mark-of-the-web, which a file
        # extracted by an already-approved installer (not downloaded
        # directly by the browser) shouldn't carry, but this hasn't been
        # verified on real Windows hardware.
        run: |
          cd desktop\src-tauri
          cargo build --release
          cd ..\..
          New-Item -ItemType Directory -Force -Path desktop\dist-app | Out-Null
          Copy-Item desktop\src-tauri\target\release\app.exe desktop\dist-app\SPOOL.exe
          # Rust's build output (several GB) has no reason to ride along
          # inside the installer payload -- only the finished .exe does.
          Remove-Item -Recurse -Force desktop\src-tauri\target

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          iscc.exe scripts\windows-installer.iss

      - name: Verify installer was produced
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path dist -Filter "SPOOL-Installer.exe" -ErrorAction SilentlyContinue
          if (-not $exe) { throw "SPOOL-Installer.exe not found in dist/ after build" }
          Write-Host "Built: $($exe.FullName) ($('{0:N1}' -f ($exe.Length / 1MB)) MB)"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: SPOOL-Installer
          path: dist/SPOOL-Installer.exe
          retention-days: 14
