{% extends "base.html" %}
{% block content %}

<form class="searchbar" method="GET" action="/"
      hx-get="/" hx-target="#results" hx-select="#results" hx-swap="outerHTML" hx-push-url="true"
      hx-trigger="input changed delay:250ms from:input[name='q'], change from:input[type='checkbox'], change from:select[name='sort']">
  <input type="search" name="q" placeholder="Search filenames, tags, print metadata…" value="{{ q }}" autocomplete="off" autofocus>
  <select name="sort">
    {% for value, label in sort_options %}
    <option value="{{ value }}" {% if value == sort %}selected{% endif %}>{{ label }}</option>
    {% endfor %}
  </select>
  <div class="ext-filters">
    {% for e in all_extensions %}
    <label class="ext-toggle">
      <input type="checkbox" name="ext" value="{{ e }}" {% if e in selected_extensions %}checked{% endif %}>
      {{ e }}
    </label>
    {% endfor %}
  </div>
  {% if all_tags %}
  <div class="ext-filters">
    {% for t in all_tags %}
    <label class="ext-toggle">
      <input type="checkbox" name="tag" value="{{ t.name }}" {% if t.name in selected_tags %}checked{% endif %}>
      #{{ t.name }}
    </label>
    {% endfor %}
  </div>
  {% endif %}
  <button type="submit">Search</button>
</form>

{% include "_results.html" %}

{% endblock %}
