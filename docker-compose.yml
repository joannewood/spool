services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # Only read once, by 003_seed_watched_roots.sh, on a truly empty
      # pgdata volume — not used by postgres itself. DROPFOLDER_HOST_PATH
      # is required; LIBRARY_HOST_PATH/DOWNLOADS_HOST_PATH may be left
      # blank in .env if you only want SPOOL watching one folder — passed
      # through as-is (not the `:-` fallback the bind mounts below use),
      # since the seed script needs to see a real empty string to know to
      # skip seeding that root at all, not a placeholder path.
      DROPFOLDER_HOST_PATH: ${DROPFOLDER_HOST_PATH}
      LIBRARY_HOST_PATH: ${LIBRARY_HOST_PATH}
      DOWNLOADS_HOST_PATH: ${DOWNLOADS_HOST_PATH}
    ports:
      # Host-reachable only for running the test suite (pytest connects
      # directly, no Docker required for the test run itself) — a
      # non-standard host port so it doesn't collide with a developer's own
      # local Postgres. Nothing else needs this; api/worker/watcher reach
      # postgres over the compose network, not this port.
      - "55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: ./services
      dockerfile: api/Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      THUMBNAILS_DIR: /data/thumbnails
      HOST_HELPER_URL: http://host.docker.internal:8100
    ports:
      - "8000:8000"
    volumes:
      # rw (not the original ro) so queries.delete_file_record can remove
      # a deleted file's thumbnail — thumbnails are a pure rendering
      # cache (always regeneratable from the source file), unlike the
      # real model files api never touches, so this doesn't weaken the
      # host-helper-only-writes-real-files boundary the rest of the app
      # relies on.
      - thumbnails:/data/thumbnails:rw
    depends_on:
      postgres:
        condition: service_healthy

  watcher:
    build:
      context: ./services
      dockerfile: watcher/Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    volumes:
      - "${DROPFOLDER_HOST_PATH}:/roots/dropfolder:rw"
      - "${LIBRARY_HOST_PATH:-./data/unused-library}:/roots/library:ro"
      - "${DOWNLOADS_HOST_PATH:-./data/unused-downloads}:/roots/downloads:rw"
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    image: spool-worker
    build:
      context: ./services
      dockerfile: worker/Dockerfile
    # pyrender's OffscreenRenderer (EGL/llvmpipe software rendering)
    # leaks memory across many render calls within one long-lived
    # process — confirmed live during a 2600-file bulk import: OOM-
    # killed twice within minutes of each other under sustained render
    # load, having rendered 800+ files without issue beforehand. The
    # real fix (recycling the process periodically, or finding/patching
    # the actual leak) is more involved; auto-restart is the immediate
    # mitigation so a crash mid-bulk-import self-heals in seconds
    # instead of silently stalling every job behind it until someone
    # notices and restarts it by hand. Paired with main.py's startup
    # requeue of any 'running' job left behind by the crash.
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      THUMBNAILS_DIR: /data/thumbnails
      JOB_TYPES: ingest,render,extract_zip
      RESCAN_INTERVAL_SECONDS: ${RESCAN_INTERVAL_SECONDS:-300}
    volumes:
      - "${DROPFOLDER_HOST_PATH}:/roots/dropfolder:rw"
      - "${LIBRARY_HOST_PATH:-./data/unused-library}:/roots/library:ro"
      - "${DOWNLOADS_HOST_PATH:-./data/unused-downloads}:/roots/downloads:rw"
      - thumbnails:/data/thumbnails:rw
    depends_on:
      postgres:
        condition: service_healthy

  # Separate lane for STEP renders (CAD tessellation is much slower than
  # reading a mesh file) so a backlog of STEP jobs never blocks quick
  # ingest/mesh-render work in `worker`. Same image, different job filter.
  # RUN_BACKFILL=false since `worker` already does the one-shot backfill walk.
  worker-step:
    image: spool-worker
    build:
      context: ./services
      dockerfile: worker/Dockerfile
    # Same rendering code path as `worker` (see its own restart comment) —
    # STEP tessellation is if anything more memory-hungry per file, so
    # the same mitigation applies here even though this lane hasn't
    # actually crashed yet.
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      THUMBNAILS_DIR: /data/thumbnails
      JOB_TYPES: render_step
      RUN_BACKFILL: "false"
    volumes:
      - "${DROPFOLDER_HOST_PATH}:/roots/dropfolder:rw"
      - "${LIBRARY_HOST_PATH:-./data/unused-library}:/roots/library:ro"
      - "${DOWNLOADS_HOST_PATH:-./data/unused-downloads}:/roots/downloads:rw"
      - thumbnails:/data/thumbnails:rw
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  thumbnails:
